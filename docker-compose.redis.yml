version: '3.8'

# Redis service for local single-user demo
# Usage: docker compose -f docker-compose.redis.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: chatgpt-local-redis
    ports:
      - "6379:6379"
    volumes:
      # Mount Redis data directory to local data/redis_data
      - ./data/redis_data:/data
      # Mount custom Redis config (optional, can use defaults)
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    # Alternative: use default config
    # command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --save 60 10000
    environment:
      # Optional: set password via environment
      # REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: chatgpt-local-network

