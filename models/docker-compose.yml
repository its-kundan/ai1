# Docker Compose for Model Services
# Usage: docker-compose up -d
# Or start individually: docker-compose up llm-service

version: '3.8'

services:
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile.llm
    ports:
      - "5005:5005"
    environment:
      - LLM_PORT=5005
      - LLM_HOST=0.0.0.0
      - LLM_BACKEND=llamacpp
      - LLM_MODEL_PATH=/app/models/llm/model.gguf
      - LLM_GPU_ENABLED=false
    volumes:
      - ./models/llm:/app/models/llm
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    ports:
      - "8100:8100"
    environment:
      - EMBED_PORT=8100
      - EMBED_HOST=0.0.0.0
      - EMBED_MODEL_NAME=all-MiniLM-L6-v2
      - EMBED_GPU_ENABLED=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    ports:
      - "8200:8200"
    environment:
      - OCR_PORT=8200
      - OCR_HOST=0.0.0.0
      - OCR_BACKEND=easyocr
      - OCR_GPU_ENABLED=false
      - OCR_UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/ocr_results:/app/data/ocr_results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 3


