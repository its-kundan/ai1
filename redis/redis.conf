# Redis configuration for local single-user demo
# Production deployments should review and adjust these settings

# Network
bind 127.0.0.1
port 6379
protected-mode yes

# Memory Management
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence - RDB snapshots
# Save snapshots to disk periodically
save 900 1      # Save if at least 1 key changed in 900 seconds (15 min)
save 300 10     # Save if at least 10 keys changed in 300 seconds (5 min)
save 60 10000   # Save if at least 10000 keys changed in 60 seconds (1 min)

# RDB file location (mounted volume in docker-compose)
dir /data
dbfilename dump.rdb

# AOF (Append Only File) - disabled by default for demo
# Enable for better durability (trades off some performance)
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec  # If AOF enabled: fsync every second

# Logging
loglevel notice
logfile ""

# Client connections
maxclients 1000
timeout 300  # Close idle connections after 5 minutes

# Slow log (log commands taking longer than 10000 microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100  # Log operations taking > 100ms

# Security (for local demo, password is optional)
# requirepass yourpassword  # Uncomment and set password if needed

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

