# Unified Docker Compose for Local Development Stack
# Usage: docker-compose up -d
# This starts Postgres (with pgvector), Redis, and optional Python model services

version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatdb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend2/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
      - ./data/postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: chatdb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./data/redis_backups:/backups
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Python Embedding Service (uncomment to use)
